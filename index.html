<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1" />
  <link rel="alternate icon" type="image/svg+xml" href="assets/icon.svg?v=1" />
  <link rel="shortcut icon" type="image/svg+xml" href="assets/favicon.svg?v=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center align-items-center min-vh-75">
      <div class="col-11 col-sm-10 col-md-8 col-lg-7 col-xl-6">
        <div class="card shadow-lg border-0 auth-card">
          <div class="card-body p-3 p-sm-4 p-md-5 text-center">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-white shadow-sm mb-3" style="width:72px;height:72px;">
              <img src="assets/icon.svg?v=1" alt="L" width="56" height="56" />
            </div>

            <h1 class="h2 mb-2 fw-bold">Login</h1>
            <p class="text-secondary mb-4">Sign in to manage your profile.</p>

            <div class="d-grid d-sm-flex gap-2 justify-content-center mb-3">
              <a class="btn btn-brand btn-lg px-4" href="login.html">Sign in</a>
              <a class="btn btn-outline-secondary btn-lg px-4" href="register.html">Create one</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
