<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Fireside Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <nav class="navbar navbar-expand-lg navbar-warm">
    <div class="container">
  <a class="navbar-brand" href="login.html">Fireside Login</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLogin" aria-controls="navLogin" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navLogin">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
          <li class="nav-item"><a class="nav-link d-none d-lg-inline" href="#" aria-disabled="true">Welcome</a></li>
          <li class="nav-item"><a class="btn btn-outline-light" href="register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6 col-xl-5">
        <div class="card shadow-lg auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="mb-4 text-center">
              <h1 class="h3 mb-1">Welcome back</h1>
              <p class="text-secondary mb-0">Sign in to continue</p>
            </div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" autocomplete="username" required aria-required="true" />
                <div class="invalid-feedback">Please enter your username.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group" id="passwordGroup">
                  <input type="password" class="form-control" id="password" autocomplete="current-password" required aria-required="true" />
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">
                    <span class="pw-eye" aria-hidden="true">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                    </span>
                  </button>
                </div>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="1" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a class="small text-decoration-none" href="#" aria-disabled="true">Forgot password?</a>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-brand" id="btnLogin">
                  <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true" id="btnSpinner"></span>
                  <span>Sign in</span>
                </button>
              </div>
            </form>
            <div id="loginAlert" class="alert mt-3 d-none" role="alert" aria-live="polite"></div>
            <p class="text-center text-muted mt-4 mb-0 small">Don’t have an account? <a href="register.html" class="link-secondary">Create one</a></p>
            <p class="text-center text-muted mt-2 mb-0 small">This page uses a warm theme for a welcoming experience.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/login.js"></script>
</body>
</html>
