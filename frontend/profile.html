<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile • Fireside Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <nav class="navbar navbar-expand-lg navbar-warm">
    <div class="container">
  <a class="navbar-brand" href="profile.html">Fireside Login <span class="brand-accent">Beta</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navProfile" aria-controls="navProfile" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navProfile">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
          <li class="nav-item"><a class="nav-link d-none d-lg-inline" href="#" aria-disabled="true">Profile</a></li>
          <li class="nav-item"><button id="logoutBtn" class="btn btn-outline-light">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4 justify-content-center">
      <div class="col-lg-4">
        <div class="card shadow-lg auth-card h-100">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Account</h2>
            <dl class="row mb-0 small" id="userDetails">
              <dt class="col-5">Username</dt>
              <dd class="col-7" id="d-username">—</dd>
              <dt class="col-5">Email</dt>
              <dd class="col-7" id="d-email">—</dd>
            </dl>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card shadow-lg auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="mb-4 text-center">
              <h2 class="h5 mb-1">Profile details</h2>
              <p class="text-secondary mb-0 small">Update your personal information</p>
            </div>
            <form id="profileForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="age">Age</label>
                  <input type="number" class="form-control" id="age" min="1" max="120" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="dob">Date of Birth</label>
                  <input type="date" class="form-control" id="dob" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="contact">Contact</label>
                  <input type="text" class="form-control" id="contact" maxlength="64" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="address">Address</label>
                  <textarea class="form-control" id="address" rows="3" maxlength="256"></textarea>
                </div>
              </div>
              <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="button" class="btn btn-outline-secondary" id="btnReset" title="Clear fields">Reset</button>
                <button type="submit" class="btn btn-brand" id="btnSave">
                  <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true" id="saveSpinner"></span>
                  <span>Save changes</span>
                </button>
              </div>
            </form>
            <div id="profileAlert" class="alert mt-3 d-none" role="alert" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/profile.js"></script>
</body>
</html>
