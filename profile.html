<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile • Secure App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Secure App</a>
      <div class="ms-auto d-flex gap-2">
        <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5">User</h2>
            <dl class="row mb-0" id="userDetails">
              <dt class="col-4">Username</dt>
              <dd class="col-8" id="d-username">—</dd>
              <dt class="col-4">Email</dt>
              <dd class="col-8" id="d-email">—</dd>
            </dl>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h2 class="h5 mb-4">Additional details</h2>
            <form id="profileForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="age">Age</label>
                  <input type="number" class="form-control" id="age" min="1" max="120" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="dob">Date of Birth</label>
                  <input type="date" class="form-control" id="dob" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="contact">Contact</label>
                  <input type="text" class="form-control" id="contact" maxlength="64" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="address">Address</label>
                  <textarea class="form-control" id="address" rows="3" maxlength="256"></textarea>
                </div>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Save changes</button>
              </div>
            </form>
            <div id="profileAlert" class="alert mt-3 d-none" role="alert"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
